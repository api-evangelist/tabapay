aid: tabapay
name: TabaPay
description: 'TabaPay is an instant money movement platform for fintechs, banks, and payment
  companies. One Unified API accepts payments (pull) and sends payouts (push) across debit and
  credit card networks (Visa, Mastercard, Discover, American Express, Accel, STAR), RTP by The
  Clearing House, and ACH, with cross-border push-to-card, 3D Secure, account verification (AVS,
  ANI, OFAC), tokenized card storage, KYB/KYC verifications, ledgers, and real-time transaction
  monitoring. TabaPay is a PCI DSS Level 1 service provider, SOC 1 and SOC 2 Type II certified,
  and backed by SoftBank Vision Fund. APIs are not publicly self-serve: clients board through
  TabaPay and receive a dedicated FQDN plus bearer credentials for sandbox and production.'

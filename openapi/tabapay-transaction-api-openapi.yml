        required: true
      responses:
        '200':
          description: A Transaction is created and processing is completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/createTransactionResponse'
              examples:
                Completed:
                  value:
                    SC: 200
                    EC: '0'
                    transactionID: TabaPay_TransactionID_

                      prepaid: true
                    pull:
                      debit: true
                      credit: true
                      prepaid: true
                  visa:
                    push:
                      enabled: true
                    pull:
                      enabled: true
                  mastercard:
                    push:
                      enabled: true
                    pull:
                      enabled: true
                  discover:
                    push:
                      enabled: true
                    pull:
                      enabled: true
                  settlement:
                    purchase:
                      routingNumber: '123456780'
                      accountNumber: '123456978'
                      ledgerID: 22CharacterledgerID123
                    disbursement:

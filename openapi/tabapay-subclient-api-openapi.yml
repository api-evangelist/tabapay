      operationId: updatesubclient2
      parameters:
      - $ref: '#/components/parameters/ClientID'
      - $ref: '#/components/parameters/SubClientID'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/subclient2Update'
        required: true
      responses:
        '200':
          description: The SubClient Information has been updated.

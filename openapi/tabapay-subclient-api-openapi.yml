        3DSFee:
          type: string
          description: Fixed fee for every 3DS invocation
          pattern: ^[0-9]*.?[0-9]{0,4}$
        accountUpdaterFee:
          type: string
          description: Fixed fee for each account updater request
          pattern: ^[0-9]*.?[0-9]{0,4}$

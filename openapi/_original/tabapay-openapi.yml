  parameters:
    ClientID:
      name: ClientID
      in: path
      description: 22-character <<glossary:ClientID>>. Ask [TabaPay Support](https://tabapay.zendesk.com/hc/en-us/requests/new) if you need to specify a <<glossary:SubClientID>>.
      required: true
      style: simple
      explode: false
      schema:
        type: string
    enhancedResponse:
      name: enhancedResponse
      in: query
      description: Provides more granular detail in 3DS responses.
      required: true
      allowEmptyValue: true
      schema:
        type: string
        minLength: 0
        maxLength: 0
    RejectDuplicateCard:
      name: RejectDuplicateCard
      in: query
      description: 'Use to disallow account creation if an account with card already exists


        Incompatible with query string `OKToAddDuplicateCard`. All requests must use `RejectDuplicateCard` or `OKToAddDuplicateCard` if using [Duplicate Card Check](https://developers.tabapay.com/reference/how-to-use-duplicate-card-check#).

        Use is allowed if <<glossary:Version>> is `v1` (not `v2`)'
      required: false
      allowEmptyValue: true
      schema:
        type: string
        minLength: 0
        maxLength: 0
    OKToAddDuplicateCard:
      name: OKToAddDuplicateCard
      in: query
      description: 'Use to allow account creation if an account with card already exists


        Incompatible with query string `RejectDuplicateCard`. All requests must use `OKToAddDuplicateCard` or `RejectDuplicateCard` if using [Duplicate Card Check](https://developers.tabapay.com/reference/how-to-use-duplicate-card-check#/).

        Use is allowed if <<glossary:Version>> is `v1` (not `v2`)'
      required: false
      allowEmptyValue: true
      schema:
        type: string
        minLength: 0
        maxLength: 0
    DeleteDuplicateCard:
      name: DeleteDuplicateCard
      in: query
      description: Use if using [Duplicate Card Check](https://developers.tabapay.com/reference/how-to-use-duplicate-card-check#/).
      required: false
      allowEmptyValue: true
      schema:
        type: string
        minLength: 0
        maxLength: 0
    AccountID:
      name: AccountID
      in: path
      description: '22 character assigned <<glossary:accountID>>.


        Returned from [Create Account](https://developers.tabapay.com/reference/account#/)'
      required: true
      style: simple
      explode: false
      schema:
        type: string
    AVS:
      name: AVS
      in: query
      description: "Use if you would like to perform [<<glossary:AVS>>](https://developers.tabapay.com/docs/address-verification)\n\nIf using in tandem with `Fees` query string, append `?AVS+Fees` or `?Fees+AVS` to your URL. \n\n Request to enable <Glossary>AVS</Glossary> at [TabaPay Support](https://tabapay.zendesk.com/hc/en-us/requests/new#/) or [help@tabapay.com](mailto:help@tabapay.com)"
      required: false
      allowEmptyValue: true
      schema:
        type: string
        minLength: 0
        maxLength: 0
    ANI:
      name: ANI
      in: query
      description: "Use if you would like to perform [<<glossary:ANI>>](https://developers.tabapay.com/docs/account-name-inquiry-ani#/)\n\nIf using in tandem with `AVS` query string, append `?ANI+AVS` or `?AVS+ANI` to your URL. \n\n Request to enable <Glossary>ANI</Glossary> at [TabaPay Support](https://tabapay.zendesk.com/hc/en-us/requests/new#/) or [help@tabapay.com](mailto:help@tabapay.com)"
      required: false
      allowEmptyValue: true
      schema:
        type: string
        minLength: 0
        maxLength: 0
    Fees:
      name: Fees
      in: query
      description: 'Use to check fees.


        If using in tandem with `AVS` query string, append `?Fees+AVS` or `?AVS+Fees` to your URL.'
      required: false
      allowEmptyValue: true
      schema:
        type: string
        minLength: 0
        maxLength: 0
    AU:
      name: AU
      in: query
      description: Use to send the card number and expiration date to network's Account Updater, and apply any card changes.
      required: false
      schema:
        type: string
    SubClientID:
      name: SubClientID
      in: path
      description: 4, 6, or 8-digit <<glossary:SubClientID>>. Ask [TabaPay Support](https://tabapay.zendesk.com/hc/en-us/requests/new) for the specific number of digits your <<glossary:SubClientID>> needs to be.
      required: true
      style: simple
      explode: false
      schema:
        type: string
    LedgerID:
      name: LedgerID
      in: path
      description: 22-character LedgerID returned from Create Ledger.
      required: true
      style: simple
      explode: false
      schema:
        type: string
    UserID:
      name: UserID
      in: path
      description: 22-character UserID returned from Create User.
      required: true
      style: simple
      explode: false
      schema:
        type: string
    KeyID:
      name: KeyID
      in: path
      description: Identification for the RSA key
      required: true
      style: simple
      explode: false
      schema:
        type: string
    Format:
      name: Format
      in: query
      description: Use to specify your key format
      required: false
      allowEmptyValue: false
      schema:
        type: string
        pattern: ^(?:ASN.1|Raw)$
    ReferenceIDQuery:
      name: referenceID
      in: query
      description: Reference ID fallback lookup.
      required: false
      schema:
        type: string
    VerificationID:
      name: VerificationID
      in: path
      description: 22-character VerificationID returned from Create Verification.
      required: true
      style: simple
      explode: false
      schema:
        type: string
    TransactionID:
      name: TransactionID
      in: path
      description: 22-character Transaction ID
      required: true
      style: simple
      explode: false
      schema:
        type: string
    authorize:
      name: authorize
      in: query
      description: "Note the query string, `?authorize`, will create an authorization only. For `pull` payments. To settle the transaction, you must call [Capture Transaction](/reference/transactioncapture). \n\n Request to enable [Auth & Capture](/docs/overview-of-auth#/) at [TabaPay Support](https://tabapay.zendesk.com/hc/en-us/requests/new#/) or [help@tabapay.com](mailto:help@tabapay.com)"
      required: false
      allowEmptyValue: true
      schema:
        type: string
        minLength: 0
        maxLength: 0
    reversal:
      name: reversal
      in: query
      description: 'Use for reversing a transaction. (i.e. if Delete Transaction Request is *after* settlement of original *pull* transaction.)


        Required to use `void` or `reversal` on every pull transaction DELETE request (non RTP).


        Request to enable [Multiple Reversals](/docs/multiple-reversals#/) at [TabaPay Support](https://tabapay.zendesk.com/hc/en-us/requests/new#/) or [help@tabapay.com](mailto:help@tabapay.com)'
      required: false
      allowEmptyValue: true
      schema:
        type: string
        minLength: 0
        maxLength: 0
    void:
      name: void
      in: query
      description: 'Use for voiding a transaction. (i.e. if Delete Transaction request is *before* settlement of original *pull* transaction.)<br><br> **Note**: When reversing a transaction with status: `AUTHOIRZED`, you must use the `?void` parameter.


        Required to use `void` or `reversal` on every pull transaction DELETE request (non RTP).'
      required: false
      allowEmptyValue: true
      schema:
        type: string
        minLength: 0
        maxLength: 0
    RTPNetworkID:
      name: RTPNetworkID
      in: path
      description: The original 35-character `networkID` (i.e. the <<glossary:RTP>> Instruction ID)
      required: true
      style: simple
      explode: false
      schema:
        type: string
    RTPRequest:
      name: request
      in: query
      description: 'Use if you are sending a Request for Return of Funds (regarding the original RTP-Credit Transfer).


        Must use `request` or `response`'
      required: false
      allowEmptyValue: true
      schema:
        type: string
        minLength: 0
        maxLength: 0
    RTPResponse:
      name: response
      in: query
      description: 'Use if you are responding to a Request for Return of Funds (regarding a received RTP-Credit Transfer).


        *Must use `response` or `request`*'
      required: false
      allowEmptyValue: true
      schema:
        type: string
        minLength: 0
        maxLength: 0
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    custom-header:
      type: apiKey
      name: Authorization
      in: header

                2-3 character [Network Response Code](/reference/iso-network-codes) of Refund (after failed void)


                *Present if Dual-Message Network*


                *Conditionally present if the first reversal attempt fails (and the network supports a second attempt)* '
              example: '00'
    apiResponseSCECStatus:
      type: object

                [Network Response Code](https://developers.tabapay.com/reference/iso-network-codes#/)'
              example: '00'
            networkRC2:
              type: string
              description: 'Refund after failed Void


                [Network Response Code](https://developers.tabapay.com/reference/iso-network-codes#/)


                Present if Dual-Message Network'
              example: '00'
            error:

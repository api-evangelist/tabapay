                    EC: '0'
                    transactionID: BhAatYvE0SvZYcnEGwb4nB
                    network: ACH
                    status: BATCH
        '207':
          description: One or more Failures occurred while processing the Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiResponseSCECTxnIDStatus'
              example:
                SC: 207
                EC: InternalErrorCode
                status: UNKNOWN
                transactionID: ''
        '429':
          description: Over your Daily (24-hour rolling) Approximation Limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiResponseSCECEM'
              example:
                SC: 429
                EC: InternalErrorCode
                EM: Limit
  /v2/clients/{ClientID}/transactions/rtp/{RTPNetworkID}:
    delete:
      tags:
      - Transaction
      summary: Delete RTP Transaction
      description: 'If using`?request`: Requests a return of a previously sent RTP push transaction.

        If using `?response`: Responds to a request of a previously received Request for Return of Funds (for a previously received RTP transaction).'
      operationId: transactionRTPDelete
      parameters:
      - $ref: '#/components/parameters/ClientID'
      - $ref: '#/components/parameters/RTPNetworkID'
      - $ref: '#/components/parameters/RTPRequest'
      - $ref: '#/components/parameters/RTPResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/deleteRTPTransaction'
        required: true
      responses:
        '200':
          description: A response to a request for return of funds was accepted (and if applicable, the reimbursement was accepted).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/transactionRTPDeleteResponse'
              examples:
                RTP Response to Reversal Request:
                  value:
                    SC: 200
                    EC: '0'
                    status: COMPLETED
                    networkRC: '000'
                    networkID: M20220808103100195T1BSCA20000003002
                    reimbursement:
                      networkRC: '000'
                      networkID: 20220808101115315T1BSCAH20000003001
        '202':
          description: A request for return of funds was accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/transactionRTPDeleteRequest'
              examples:
                RTP Reversal Request:
                  value:
                    SC: 202
                    EC: '0'
                    status: ACCEPTED
                    networkRC: '000'
                    networkID: M20220808103100195T1BSCA20000003002
        '207':
          description: One or more Failures occurred while processing the Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiResponseSCEC'
              example:
                SC: 207
                EC: Internal Error Code
  /v2/clients/{ClientID}/accounts/{AccountID}:
    put:
      tags:
      - Account
      summary: Update Account V2
      description: Update any one or more fields (e.g. Owner, Address, Phone, Exp. date), excluding card account numbers ([Refer to v1](https://developers.tabapay.com/reference/updateaccount#/)).
      operationId: updateAccountV2
      parameters:
      - $ref: '#/components/parameters/ClientID'
      - $ref: '#/components/parameters/AccountID'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/updateAccountV2'
        required: true
      responses:
        '200':
          description: Account is updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiResponseSCECEM'
              example:
                SC: 200
                EC: '0'
components:
  schemas:
    3dsauthenticate:
      type: object
      required:
      - 3dsID
      - jwt
      properties:
        3dsID:
          $ref: '#/components/schemas/3dsID'
        jwt:
          type: string
          description: '[JSON Web Token](https://en.wikipedia.org/wiki/JSON_Web_Token)'
    3dsID:
      type: string
      description: 3dsID returned from [3dsinit](https://developers.tabapay.com/reference/3dsinit#/)
    3dsVersion:
      type: string
      description: 'The 3D Secure Version that was used to process this request.


        Expected values are of the form: `2.X.X`'
      example: 2.2.0
    SC:
      type: integer
      description: '[HTTP Status Code](https://developers.tabapay.com/reference/http-status-codes#/)'
    EC:
      type: string
      description: Internal Error Code. This is used to help TabaPay team members trace an error.
    EM:
      type: string
      description: Short description of the error if an error occurred.
    3dsAuthenticateResponse:
      type: object
      properties:
        SC:
          $ref: '#/components/schemas/SC'
        EC:
          $ref: '#/components/schemas/EC'
        EM:
          $ref: '#/components/schemas/EM'
        actionCode:
          type: string
          description: "[Result](/reference/3ds-challenge-results) of the 3DS transaction attempt\n\n- SUCCESS \n- CANCEL \n- ERROR \n- FAILURE \n- NOACTION \n- TIMEOUT"
          example: SUCCESS
        errorNumber:
          type: string
          description: Listed error number
          example: '0'
        errorDescription:
          type: string
          description: Description of the listed actionCode error and errorNumber
          example: '0'
        3dsVersion:
          $ref: '#/components/schemas/3dsVersion'
        processorTransactionID:
          type: string
          description: Processor Transaction Identifier
          example: '11111111111111111111'
        status:
          type: string
          example: '`Y`'
          description: 'Transaction Status Result


            Possible Values:

            - `Y` Successful Authentication

            - `N` Failed Authentication

            - `U` Unable to Complete Authentication

            - `A` Successful Attempts Transaction

            - `R` Authentication Rejected

            - `I` Informational Only; 3DS Requester challenge preference acknowledged'
        ECI:
          type: string
          pattern: ^[0][012567]$
          description: 'Electronic Commerce Indicator


            Possible Values:

            - `00`

            - `01`

            - `02`

            - `04`

            - `05`

            - `06`

            - `07`'
          example: '05'
        UCAF:
          type: string
          description: 'Universal Cardholder Authentication Field


            [Visa](/docs/visa-cavv-results-code#/) uses <<glossary:CAVV>> (Cardholder Authentication Verification Value)


            [MasterCard](/docs/mastercard-ucaf-collection-downgrade-indicator#/) uses AAV (Account-Holder Authentication Value)'
          example: '1111111111111111111111111111'
        XID:
          type: string
          description: XID (Transaction ID)
          example: VkM0MXAwOGhjMGxuaUcxU1VtNjA=
    3dsinit:
      type: object
      required:
      - order
      properties:
        sdkVersion:
          type: string
          description: This is for mobile SDK flows (if you use this, you do not need to pass in AccountID, but you have to use lookup.sdkSessionID).
        account:
          type: object
          description: Account Details
          properties:
            accountID:
              type: string
              description: '<<glossary:Account ID>>


                22 characters.


                Exclusively use `accountID` field or `card` object to input card information. Incompatible with the `card` object.'
              example: 22CharacterTabaPayID12
            card:
              type: object
              description: 'Payment Card Data.


                Incompatible with `accountID`. Exclusively use: `card` *OR* `accountID`.'
              properties:
                accountNumber:
                  type: string
                  pattern: ^[0-9]{13,19}$
                  description: '<<glossary:Payment Card Not Encrypted>>


                    A Primary Account Number (PAN/Card Number)


                    Not compatible with `accountID`.'
                  example: '4111111111111111'
        order:
          type: object
          description: Order
          required:
          - orderID
          - amount
          properties:
            orderID:
              type: string
              format: uuid
              description: 1-50 characters
              pattern: ^[a-zA-Z0-9_-]{1,50}$
            currency:
              $ref: '#/components/schemas/currency'
            amount:
              $ref: '#/components/schemas/amount'
    amount:
      type: string
      description: See how to [properly format an amount](/reference/data#how-to-specify-an-amount-value).
      pattern: ^[0-9]*.?[0-9]{0,4}$
    currency:
      type: string
      description: '[ISO 4217](https://en.wikipedia.org/wiki/ISO_4217) 3-Digit [Currency Code](https://developers.tabapay.com/reference/currency-numbers#/).


        *Optional. Default is `840`*'
      pattern: ^[0-9]{3}$
      example: '840'
    3dsInitResponse:
      type: object
      properties:
        SC:
          $ref: '#/components/schemas/SC'
        EC:
          $ref: '#/components/schemas/EC'
        EM:
          $ref: '#/components/schemas/EM'
        3dsID:
          $ref: '#/components/schemas/3dsID'
        jwt:
          type: string
          pattern: ^[a-zA-Z0-9-_.]+$
          description: '[JWT](https://jwt.io)'
        deviceCollectionURL:
          type: string
          description: 'URL for Device Data Collection.


            See [3DS FAQ](https://developers.tabapay.com/reference/device-data-collection#/) for details on how to use this value.'
    apiResponseSCEC:
      type: object
      properties:
        SC:
          $ref: '#/components/schemas/SC'
        EC:
          $ref: '#/components/schemas/EC'
    apiResponseSCECEM:
      type: object
      properties:
        SC:
          $ref: '#/components/schemas/SC'
        EC:
          $ref: '#/components/schemas/EC'
        EM:
          $ref: '#/components/schemas/EM'
    3dslookup:
      type: object
      required:
      - account
      - order
      - 3dsID
      - authenticationIndicator
      - transactionType
      - productCode
      - browser
      properties:
        3dsID:
          $ref: '#/components/schemas/3dsID'
        sdkSessionID:
          $ref: '#/components/schemas/sdkSessionID'
        authenticationIndicator:
          $ref: '#/components/schemas/authenticationIndicator'
        transactionMode:
          $ref: '#/components/schemas/transactionMode'
        transactionType:
          $ref: '#/components/schemas/transactionType'
        productCode:
          $ref: '#/components/schemas/productCode'
        account:
          type: object
          description: Account Details
          required:
          - owner
          properties:
            accountID:
              type: string
              description: '<<glossary:Account ID>>


                22 characters.


                Exclusively use `accountID` field or `card` object to input card information. Incompatible with the `card` object.'
            card:
              type: object
              description: 'Payment Card Data.


                Incompatible with `accountID`. Exclusively use: `card` *OR* `accountID`.'
              properties:
                accountNumber:
                  type: string
                  pattern: ^[0-9]{13,19}$
                  description: '<<glossary:Payment Card Not Encrypted>> A Primary Account Number (PAN/Card Number)


                    Compatible *only* with `expirationDate`, nothing else.'
                expirationDate:
                  type: string
                  pattern: ^[0-9]{6}$
                  description: '<<glossary:Payment Card Not Encrypted>> Expiration Date in YYYYMM


                    Compatible *only* with `accountNumber`, nothing else.'
            owner:
              type: object
              description: Owner
              required:
              - email
              - phone
              - name
              properties:
                email:
                  type: string
                  pattern: ^[A-Za-z._-]+@(?:[A-Za-z_-]+.?)*.[A-Za-z]+$
                  description: Valid Email Address
                  example: test@tabapay.com
                phone:
                  $ref: '#/components/schemas/phone'
                name:
                  type: object
                  required:
                  - first
                  - last
                  properties:
                    first:
                      type: string
                      description: 2-22 character First Name
                      pattern: ^[ a-zA-Z0-9_-]+$
                      example: Tobias
                    last:
                      type: string
                      description: 2-22 character Last Name
                      pattern: ^[ a-zA-Z0-9_-]+$
                      example: Pennywick
                address:
                  type: object
                  description: "Billing Address. \n\nPlease Do NOT use this field unless you are allowed to send cards in the clear. \n\nOtherwise, please Create Accounts with Address. \n If a TabaPay Account already has an address, then that will be used."
                  properties:
                    line1:
                      $ref: '#/components/schemas/line1'
                    line2:
                      $ref: '#/components/schemas/line2'
                    city:
                      $ref: '#/components/schemas/city'
                    state:
                      $ref: '#/components/schemas/state'
                    zipcode:
                      $ref: '#/components/schemas/zipcode'
                    country:
                      $ref: '#/components/schemas/country'
        order:
          type: object
          description: Order
          required:
          - orderID
          - amount
          properties:
            orderID:
              type: string
              format: uuid
              description: 1-50 characters
              pattern: ^[a-zA-Z0-9_-]{1,50}$
            currency:
              $ref: '#/components/schemas/currency'
            amount:
              $ref: '#/components/schemas/amount'
        browser:
          $ref: '#/components/schemas/browser'
    phone:
      type: object
      required:
      - number
      description: Phone *object*
      properties:
        countryCode:
          type: string
          description: '1-3 digit Country Calling Code


            *Optional.* Default is `1`.'
          pattern: ^[0-9]{3}$
          example: '1'
        number:
          type: string
          description: 'Phone Number.


            For phone numbers with `countryCode` equal to `1` (or blank), provide a 10-digit phone number. For all `countryCodes`, other than `1`, a 4-14 digit phone number is accepted.'
          pattern: ^[0-9]{4,14}$
          example: '5555555555'
    browser:
      type: object
      required:
      - deviceChannel
      description: Browser Information. For more information on these fields see [here](https://developers.tabapay.com/reference/browser-fields)
      properties:
        javascriptEnabled:
          $ref: '#/components/schemas/javascriptEnabled'
        userAgent:
          $ref: '#/components/schemas/userAgent'
        header:
          $ref: '#/components/schemas/header'
        javaEnabled:
          $ref: '#/components/schemas/javaEnabled'
        language:
          $ref: '#/components/schemas/language'
        colorDepth:
          $ref: '#/components/schemas/colorDepth'
        screenHeight:
          $ref: '#/components/schemas/screenHeight'
        screenWidth:
          $ref: '#/components/schemas/screenWidth'
        ipAddress:
          $ref: '#/components/schemas/ipAddress'
        browserInfo:
          $ref: '#/components/schemas/browserInfo'
        deviceChannel:
          $ref: '#/components/schemas/deviceChannel'
    sdkSessionID:
      type: string
      description: 'Mobile flow referenceID (used in conjunction with init.sdkVersion, comes from the SDK''s setup.onComplete)


        Required if the device channel is SDK.'
    authenticationIndicator:
      type: string
      pattern: ^(?:0[1|2|3|4|5|6])$
      description: 2-digit [Authentication Indicator](https://developers.tabapay.com/reference/lookup#/authentication-indicator)
    transactionMode:
      type: string
      pattern: ^(?:M|P|R|S|T)$
      description: 1-character [Transaction Mode](https://developers.tabapay.com/reference/lookup#/transaction-mode)
    transactionType:
      type: string
      pattern: ^C$
      description: '`C` is the only [Transaction Type](https://developers.tabapay.com/reference/lookup#/transaction-type) supported.'
    productCode:
      type: string
      pattern: ^(?:PHY|CHA|ACF|QCT|PAL)$
      description: 3-character [Product Code](lookup#product-code)
    line1:
      type: string
      description: Address Line 1
      pattern: ^[ a-zA-Z0-9._-]+$
    line2:
      type: string
      description: 'Address Line 2


        *Optional*'
      pattern: ^[ a-zA-Z0-9._-]+$
    city:
      type: string
      description: City
      pattern: ^[ a-zA-Z0-9_-]+$
    state:
      type: string
      description: 'State Code


        [State Code](https://developers.tabapay.com/reference/us-state-codes#/) must be a valid 2-character code if `country` is [840](https://developers.tabapay.com/reference/country-codes#/) or [Canadian 2-char code](https://developers.tabapay.com/reference/canadian-province-codes#/) if [124](https://developers.tabapay.com/reference/country-codes#/).'
      pattern: ^[ a-zA-Z0-9_-]+$
    zipcode:
      type: string
      description: 'Zip Code


        If `country` is `840`, `zipcode` must be 5 or 9 digits.

        If country is `124`, `zipcode` must be in the *A1A 1A1* format.

        Zip codes from other countries will not be checked.'
      pattern: ^[ a-zA-Z0-9_-]+$
    country:
      type: string
      description: '[Country Code](https://developers.tabapay.com/reference/country-codes#/)


        *Optional. Default is `840`*'
      pattern: ^[0-9]{3}$
      example: '840'
    javascriptEnabled:
      type: boolean
      description: '*Deprecated*


        Javascript Enabled'
    userAgent:
      type: string
      description: '*Deprecated*


        User Agent'
    header:
      type: string
      description: '*Deprecated*


        Header'
    javaEnabled:
      type: boolean
      description: '*Deprecated*


        Java Enabled'
    language:
      type: string
      description: '*Deprecated*


        Language'
    colorDepth:
      type: string
      description: '*Deprecated*


        Color Depth'
    screenHeight:
      type: string
      description: '*Deprecated*


        Screen Height'
    screenWidth:
      type: string
      description: '*Deprecated*


        Screen Width'
    ipAddress:
      type: string
      description: '*Deprecated*


        IP Addresses in IPv4 or IPv6 formats are accepted.'
    deviceChannel:
      type: string
      pattern: ^(?:Browser|SDK)$
      description: Either `Browser` or `SDK`
    browserInfo:
      type: string
      description: 'Concatenated [Browser Data Fields](https://developers.tabapay.com/reference/browser-fields). Concatenate the below fields (in order!) with the `|`


        1. `javascriptEnabled`

        2. `userAgent`

        3. `header`

        4. `javaEnabled`

        5. `language`

        6. `colorDepth`

        7. `screenHeight`

        8. `screenWidth`

        9. `timezone`

        10. `ipAddress`




        *See an example [here](https://developers.tabapay.com/reference/browser-fields#browser-object-field-browserinfo)*'
    3dsLookupResponse:
      type: object
      properties:
        SC:
          $ref: '#/components/schemas/SC'
        EC:
          $ref: '#/components/schemas/EC'
        EM:
          $ref: '#/components/schemas/EM'
        3dsVersion:
          $ref: '#/components/schemas/3dsVersion'
        enrolled:
          type: string
          description: 'Authentication Eligibility Status


            Possible Values:

            - `Y` Enrolled

            - `N` Not Enrolled

            - `U` Issuer Server Unavailable

            - `B` Merchant bypassed authentication'
          example: Y
        processorTransactionID:
          type: string
          description: Processor Transaction Identifier
          example: '11111111111111111111'
        dsTransactionID:
          type: string
          description: "Directory Server Transaction Identifier\n\n Save to pass to [Create Transaction](/reference/transactioncreate) for a 3DS Payment"
          example: 11111111-2222-3333-4444-555555555555
        status:
          type: string
          example: '`Y`'
          description: 'Transaction Status Result


            Possible Values:

            - `Y` Successful Authentication

            - `N` Failed Authentication

            - `B` Merchant bypassed authentication

            - `U` Unable to Complete Authentication

            - `A` Successful Attempts Transaction

            - `C` Challenge Required for Authentication

            - `R` Authentication Rejected

            - `I` Informational Only; 3DS Requester challenge preference acknowledged'
        ECI:
          type: string
          pattern: ^[0][012567]$
          description: '[Electronic Commerce Indicator](/docs/visa-eci-response)


            Possible Values:

            - `00`

            - `01`

            - `02`

            - `05`

            - `06`

            - `07`'
          example: '05'
        UCAF:
          type: string
          description: 'Universal Cardholder Authentication Field


            [Visa](/docs/visa-cavv-results-code#/) uses <<glossary:CAVV>> (Cardholder Authentication Verification Value)


            [MasterCard](/docs/mastercard-ucaf-collection-downgrade-indicator#/) uses AAV (Account-Holder Authentication Value)'
          example: '1111111111111111111111111111'
        XID:
          type: string
          description: 'XID (Transaction ID)


            Optional'
          example: VkM0MXAwOGhjMGxuaUcxU1VtNjA=
        challengeURL:
          type: string
          description: 'Consumer Authentication URL


            ***Only present if Challenge***'
          example: https://someplace.somewhere.com/challenge
        payload:
          type: string
          description: 'Base64 Encoded Payment Request


            ***Only present if Challenge***'
        cardholderInfo:
          type: string
          description: 'Text provided by the ACS/Issuer to Cardholder during a Frictionless transaction. The Issuer can provide information to Cardholder. For example: Additional authentication is needed for this transaction, please contact (Issuer Name) at xxx-xxx-xxxx. The Issuing Bank can optionally support this value. The merchant is required to display this within their Checkout when present.'
        signatureVerification:
          type: string
          description: "Transaction Signature status identifier. \n\nPossible Values:\nY - Indicates that the signature of the PARes has been validated successfully and the message contents can be trusted.\nN - Indicates that the PARes could not be validated. This result could be for a variety of reasons; tampering, certificate expiration, etc., and the result should not be trusted."
        stepUpURL:
          type: string
          description: 'The fully qualified URL that the client uses to post the cardholder in order to complete the Consumer Authentication transaction for the Cardinal Cruise API integration.

            Note: This is only for a Cardinal Cruise API Integration'
        3dsRC:
          type: string
          description: TabaPay Error Code for <<glossary:3DS>>, this should be 0 unless there is an issue. Please store this in your logs.
    createAccount:
      type: object
      required:
      - owner
      - referenceID
      properties:
        referenceID:
          type: string
          pattern: ^[a-zA-Z0-9_-]{1,15}$
          description: 1-15 characer unique referenceID. This is used to do a [Retrieve via ReferenceID](https://developers.tabapay.com/reference/retrieve-via-referenceid#/) in case of an HTTP timeout, or any scenario where you fail to get a response body
        bank:
          type: object
          description: 'Bank Account Data


            *Choose either* `bank` *or* `card`. *Do not include both, or leave both out.*'
          required:
          - routingNumber
          - accountNumber
          - accountType
          properties:
            routingNumber:
              type: string
              pattern: ^[0-9]{9}$
              description: '9-digit [Routing Number](https://en.wikipedia.org/wiki/ABA_routing_transit_number). TabaPay performs [check-digit validations](https://en.wikipedia.org/w/index.php?title=ABA_routing_transit_number&section=7#Check_digit); no other validations are done.


                *Required if choosing `bank`*'
            accountNumber:
              type: string
              pattern: ^[0-9]{4,17}$
              description: 'Bank Account Number.


                *Required if choosing `bank`*'
            accountType:
              type: string
              pattern: ^[CSABL]$
              description: 'Bank Account Type.

                - `S` Savings

                - `C` Checking

                - `A` Business Savings

                - `B` Business Checking

                - `L` Loan


                No validations are done to match `accountNumber` to `accountType`. Required if choosing `bank`'
              example: C
        card:
          type: object
          description: '**Choose either* `bank` *or* `card`. *Do not include both, or leave both out.**


            Payment Card Data.


            Choose ***exactly ONE*** of the following:

            - [Payment Card Not Encrypted](https://developers.tabapay.com/docs/glossary#payment-card-not-encrypted)

            - [Payment Card Encrypted](https://developers.tabapay.com/docs/glossary#payment-card-encrypted)

            - `token`

            - `device` *object*'
          properties:
            accountNumber:
              type: string
              pattern: ^[0-9]{13,19}$
              description: '<<glossary:Payment Card Not Encrypted>>A Primary Account Number (PAN/Card Number)


                Compatible *only* with `expirationDate` and nothing else.'
            expirationDate:
              type: string
              pattern: ^[0-9]{6}$
              description: '<<glossary:Payment Card Not Encrypted>>Expiration Date in YYYYMM


                Compatible *only* with `accountNumber` and nothing else.'
            keyID:
              $ref: '#/components/schemas/keyID'
            data:
              $ref: '#/components/schemas/data'
            token:
              type: string
              pattern: ^[A-Za-z0-9_+=-]{344}$
              format: byte
              description: 'Card Token (from the [PCI-compliant iFrame](https://developers.tabapay.com/reference/browser-sdk#/basic-custom-iframe))


                Incompatible with any other `card` field.'
            device:
              type: object
              description: 'Card Data from a [Secure Device](https://developers.tabapay.com/docs/card-present-transactions#/)


                Incompatible with any other `card` object(s) or field(s)*'
              required:
              - id
              - blob
              properties:
                id:
                  type: string
                  description: TabaPay-assigned device ID
                blob:
                  $ref: '#/components/schemas/blob'
        owner:
          type: object
          required:
          - name
          description: Owner Details
          properties:
            name:
              $ref: '#/components/schemas/name'
            address:
              type: object
              description: 'Address.


                *All fields optional.* However, if you''re planning on using AVS in [QueryCard](https://developers.tabapay.com/reference/cardquery#/), provide an accurate `zipcode` at the minimum. And, if you can, provide an accurate `line1` value as well.'
              properties:
                line1:
                  $ref: '#/components/schemas/line1'
                line2:
                  type: string
                  description: Address Line 2
                  pattern: ^[ a-zA-Z0-9._-]+$
                city:
                  $ref: '#/components/schemas/city'
                state:
                  $ref: '#/components/schemas/state'
                zipcode:
                  $ref: '#/components/schemas/zipcode'
                country:
                  $ref: '#/components/schemas/country'
            phone:
              type: object
              description: Phone *object*
              properties:
                countryCode:
                  type: string
                  description: '1-3 digit Country Calling Code


                    *Optional.* Default is `1`.'
                  pattern: ^[0-9]{3}$
                  example: '1'
                number:
                  type: string
                  description: 'Phone Number.


                    For phone numbers with `countryCode` equal to `1` (or blank), provide a 10-digit phone number. For all `countryCodes`, other than `1`, a 4-14 digit phone number is accepted.'
                  pattern: ^[0-9]{4,14}$
                  example: '5555555555'
    name:
      type: object
      description: 'Name


        Use Either: (1) `company` **OR** (2) `first`, `middle`, `last`, and `suffix`


        If choosing (2), `first` and `last` are required, `middle` and `suffix` are optional*'
      properties:
        company:
          type: string
          description: 'Company Name


            Incompatible with any other `name` field.'
          pattern: ^[ a-zA-Z0-9_-]+$
        first:
          type: string
          description: 'First Name


            Incompatible with `company` name'
          pattern: ^[ a-zA-Z0-9_-]+$
        middle:
          type: string
          description: 'Middle Name


            Incompatible with `company` name'
          pattern: ^[ a-zA-Z0-9_-]+$
        last:
          type: string
          description: 'Last Name


            Incompatible with `company` name'
          pattern: ^[ a-zA-Z0-9_-]+$
        suffix:
          type: string
          description: 'Suffix


            Incompatible with `company` name'
          pattern: ^[ a-zA-Z0-9_-]+$
    accountID:
      type: string
      description: 22 characters assigned <<glossary:accountID>> representing one card or bank account.
    keyID:
      type: string
      pattern: ^[a-zA-Z0-9_-]{22}$
      description: 'Required field of ***<<glossary:Payment Card Encrypted>>***


        22 character KeyID. Ensure the RSA key you''re using to encrypt the card data is consistent with this keyID


        Compatible with `data` and nothing else.'
    data:
      type: string
      description: 'Required field of ***<<glossary:Payment Card Encrypted>>***


        [RSA-encrypted card data](https://developers.tabapay.com/reference/pci-helper-rsa#/what-data-do-i-encrypt) using RSA key with KeyID `keyID`.


        Compatible with `keyID` and nothing else'
    blob:
      type: string
      description: URL-safe, Base64 encoded card data
      pattern: ^[A-Za-z0-9_+=-]{1500}$
    accountCreateResponse:
      type: object
      properties:
        SC:
          $ref: '#/components/schemas/SC'
        EC:
          $ref: '#/components/schemas/EC'
        accountID:
          $ref: '#/components/schemas/accountID'
        card:
          type: object
          description: 'Card Details


            Not returned if using <<glossary:Payment Card Not Encrypted>>'
          required:
          - last4
          properties:
            last4:
              type: string
              description: Last 4 of Card Account Number (PAN)
              pattern: ^[0-9]{4}$
            expirationDate:
              type: string
              description: 'Expiration Date

                YYYYMM Format'
        notices:
          type: string
          description: Important Notices
    accountCreateResponseDuplicateCard:
      type: object
      properties:
        SC:
          $ref: '#/components/schemas/SC'
        EC:
          $ref: '#/components/schemas/EC'
        EM:
          $ref: '#/components/schemas/EM'
        duplicateAccountIDs:
          type: array
          items:
            $ref: '#/components/schemas/accountID'
          description: '<<glossary:AccountID>>s using the same Card Account Number (PAN)


            If more than 3 <<glossary:AccountID>>s exist, only the 3 most recently created will be present*'
    owner:
      type: object
      required:
      - name
      description: Owner Details
      properties:
        name:
          $ref: '#/components/schemas/name'
        address:
          type: object
          description: 'Address.


            *All fields optional.* However, if you''re planning on using AVS in [QueryCard](https://developers.tabapay.com/reference/cardquery#/), provide an accurate `zipcode` at the minimum. And, if you can, provide an accurate `line1` value as well.'
          properties:
            line1:
              $ref: '#/components/schemas/line1'
            line2:
              type: string
              description: Address Line 2
              pattern: ^[ a-zA-Z0-9._-]+$
            city:
              $ref: '#/components/schemas/city'
            state:
              $ref: '#/components/schemas/state'
            zipcode:
              $ref: '#/components/schemas/zipcode'
            country:
              $ref: '#/components/schemas/country'
        phone:
          type: object
          required:
          - number
          description: Phone *object*
          properties:
            countryCode:
              type: string
              description: '1-3 digit Country Calling Code


                *Optional.* Default is `1`.'
              pattern: ^[0-9]{3}$
              example: '1'
            number:
              type: string
              description: 'Phone Number.


                For phone numbers with `countryCode` equal to `1` (or blank), provide a 10-digit phone number. For all `countryCodes`, other than `1`, a 4-14 digit phone number is accepted.'
              pattern: ^[0-9]{4,14}$
              example: '5555555555'
    referenceID:
      type: string
      format: string
      description: 1-15 character unique [referenceID](https://developers.tabapay.com/docs/glossary#reference-id). Used for [Retrieve via ReferenceID](https://developers.tabapay.com/reference/retrieve-via-referenceid) in case of an HTTP timeout, or any scenario where you fail to get a response body. *Not case sensitive*
      pattern: ^[a-zA-Z0-9_-]{1,15}$
    routingNumber:
      type: string
      pattern: ^[0-9]{9}$
      description: '[ABA routing transit number](https://en.wikipedia.org/wiki/ABA_routing_transit_number)'
    accountType:
      type: string
      pattern: ^[SCABL]$
      description: 'Bank Account Type.

        - `S` Savings

        - `C` Checking

        - `A` Business Savings

        - `B` Business Checking

        - `L` Loan '
    retrieveAccountResponse:
      type: object
      required:
      - owner
      - referenceID
      properties:
        SC:
          $ref: '#/components/schemas/SC'
        EC:
          $ref: '#/components/schemas/EC'
        referenceID:
          $ref: '#/components/schemas/referenceID'
        bank:
          type: object
          description: Bank Details
          required:
          - last4
          properties:
            routingNumber:
              $ref: '#/components/schemas/routingNumber'
            last4:
              type: string
              description: Last 4 of Bank Account Number
            accountType:
              $ref: '#/components/schemas/accountType'
        card:
          type: object
          description: Card Details
          required:
          - last4
          properties:
            last4:
              type: string
              description: Last 4 of Card Account Number (PAN)
            expirationDate:
              type: string
              description: 'Expiration Date in YYYYMM Format


                Returned if present in the account.'
        owner:
          $ref: '#/components/schemas/owner'
    queryBank:
      type: object
      required:
      - routingNumber
      properties:
        routingNumber:
          $ref: '#/components/schemas/routingNumber'
    queryBankResponse:
      type: object
      properties:
        SC:
          $ref: '#/components/schemas/SC'
        EC:
          $ref: '#/components/schemas/EC'
        RTP:
          type: boolean
          description: <<glossary:RTP>>-enabled
          example: true
        RTPAttributes:
          type: object
          description: Additional RTP Attributes of the Routing Number
          properties:
            TCH:
              type: boolean
              description: The routing number enablement for Real Time Payments within The Clearing House (TCH) network
              example: true
            TCHRequestForPayment:
              type: boolean
              description: The routing number enablement for [RfP (Request for Payment](/docs/request-for-payment-via-rtp-by-tch#/) within The Clearing House (TCH) network.
              example: false
            FED:
              type: boolean
              description: The routing number enablement for Real Time Payments within the FedNow network
              example: true
            FEDRequestForPayment:
              type: boolean
              description: The routing number enablement for Request For Payment (RFP) within the FedNow network
              example: false
    queryCard:
      type: object
      required:
      - owner
      properties:
        account:
          type: object
          description: 'TabaPay Account Details


            Incompatible with `card`. Exclusively use `account` or `card`.'
          required:
          - accountID
          properties:
            accountID:
              type: string
              description: 22-character <<glossary:Account ID>>.
              example: 22CharacterTabaPayID12
            securityCode:
              type: string
              pattern: ^[0-9]{3,4}$
              description: "3-4 digit <<glossary:Security Code>>, <<glossary:CVV>>, or <<glossary:CVV2>>. \n\nOptional. Include to request the verification of the security code."
        card:
          type: object
          description: 'Payment Card Data.


            Choose ***exactly ONE*** of the following:

            - [Payment Card Not Encrypted](https://developers.tabapay.com/docs/glossary#payment-not-encrypted)

            - <<glossary:Payment Card Encrypted>>

            - `token`

            - `device` *object*

            - `mobilePay` *object*


            Incompatible with `account`. Exclusively use: `card` or `account`.'
          properties:
            accountNumber:
              type: string
              pattern: ^[0-9]{13,19}$
              description: 'Required field of ***[Payment Card Not Encrypted](https://developers.tabapay.com/docs/glossary#payment-not-encrypted)***


                13-19 digit Primary Account Number (PAN/Card Number)


                Compatible with `expirationDate` and `securityCode`, nothing else.'
            expirationDate:
              type: string
              pattern: ^[0-9]{6}$
              description: 'Conditionally required field of ***[Payment Card Not Encrypted](https://developers.tabapay.com/docs/glossary#payment-not-encrypted)***


                Expiration Date in YYYYMM format.


                Compatible with `accountNumber` and `securityCode`, nothing else.'
              example: '202906'
            securityCode:
              type: string
              pattern: ^[0-9]{3,4}$
              description: 'Optional field of ***[Payment Card Not Encrypted](https://developers.tabapay.com/docs/glossary#payment-not-encrypted)***


                3-4 digit <<glossary:Security Code>>. Coorelates with <<glossary:CVV>>, or <<glossary:CVV2>>.


                Optional. Include to request the verification of the security code.


                Compatible with `accountNumber` and `expirationDate`, nothing else.'
            keyID:
              $ref: '#/components/schemas/keyID'
            data:
              $ref: '#/components/schemas/data'
            token:
              $ref: '#/components/schemas/tokeniFrame'
            device:
              $ref: '#/components/schemas/device'
            mobilePay:
              $ref: '#/components/schemas/mobilePay'
        owner:
          type: object
          required:
          - name
          description: Owner Details
          properties:
            name:
              $ref: '#/components/schemas/name'
            address:
              type: object
              description: 'Address.


                *All fields optional.* However, if you''re planning on using <<glossary:AVS>> in [QueryCard](https://developers.tabapay.com/reference/cardquery#/), provide an accurate `zipcode` at the minimum. And, if you can, provide an accurate `line1` value as well.'
              properties:
                line1:
                  $ref: '#/components/schemas/line1'
                line2:
                  type: string
                  description: Address Line 2
                  pattern: ^[ a-zA-Z0-9._-]+$
                city:
                  $ref: '#/components/schemas/city'
                state:
                  $ref: '#/components/schemas/state'
                zipcode:
                  $ref: '#/components/schemas/zipcode'
                country:
                  $ref: '#/components/schemas/country'
    device:
      type: object
      description: 'Card Data

        - From a [Secure Device](https://developers.tabapay.com/docs/card-present-transactions)

        - From a [GooglePay PaymentMethodToken](https://developers.tabapay.com/reference/googlepay#/y)


        Incompatible with any other `card` object(s) or field(s)'
      required:
      - id
      - blob
      properties:
        id:
          type: string
          description: 'Either a:

            - TabaPay-assigned device ID

            - [GooglePay|gatewayMerchantId](https://developers.tabapay.com/reference/googlepay#/)'
        blob:
          $ref: '#/components/schemas/blob'
    mobilePay:
      type: object
      required:
      - accountNumber
      - expirationDate
      - cryptogram
      - transactionID
      - network
      - type
      description: A Decrypted [Apple Pay](https://developers.tabapay.com/docs/apple-pay) Token
      properties:
        accountNumber:
          type: string
          description: Pseudo Payment Card Account Number
          pattern: ^[0-9]{13,19}$
        expirationDate:
          $ref: '#/components/schemas/expirationDateMobilePay'
        cryptogram:
          type: string
          format: byte
          description: Payment Data Cryptogram
          pattern: ^[A-Za-z0-9_+=/-]{28}$
        transactionID:
          type: string
          format: byte
          description: Transaction Identifier in Hex
          pattern: ^[A-Za-z0-9]{64}$
        eciIndicator:
          type: string
          description: '1-digit <<glossary:ECI>> Indicator. Remove any leading `0`s.


            For example if received ECI is `05` convert to `5` and populate this field


            Usually only present when `network` is `Visa`'
          pattern: ^[0-9]$
          example: '5'
        network:
          type: string
          description: 'Card Network.

            - `Visa`

            - `MasterCard`

            - `Discover`

            - `Amex`

            - etc...'
          pattern: ^[A-Za-z]+$
          example: Visa
        type:
          type: string
          description: "Card Type. Either\n- `Debit`\n- `Credit`\n- `PrePaid`\n etc..."
          pattern: ^[A-Za-z]+
          example: Debit
    tokeniFrame:
      type: string
      pattern: ^[A-Za-z0-9_+=-]{344}$
      format: byte
      description: 'Card Token (from the [PCI-compliant iFrame](https://developers.tabapay.com/reference/browser-sdk#/basic-custom-iframe))


        Incompatible with any other `card` field.'
    expirationDateMobilePay:
      type: string
      pattern: ^[0-9]{6}$
      description: "\nExpiration Date in YYYYMM.\n\n Note: Convert YYMMDD format to YYYYMM."
    queryCardResponse:
      type: object
      properties:
        SC:
          $ref: '#/components/schemas/SC'
        EC:
          $ref: '#/components/schemas/EC'
        EM:
          $ref: '#/components/schemas/EM'
        card:
          type: object
          description: ''
          properties:
            bin:
              type: string
              description: First 6 digits of the card number
              example: '411111'
            last4:
              type: string
              description: Last 4 digits of the card number
              example: '1111'
            nameFI:
              type: string
              description: "Issuer Name\n\n*Note:* \n1. Not present if no issuer name found.\n2. TabaPay will Include (CashApp) in `nameFI` if it is a CashApp BIN."
            pull:
              type: object
              description: Debit Transaction
              properties:
                enabled:
                  type: string
                  description: Eligible for pull
                  example: true
                network:
                  type: string
                  description: Payment network
                  example: Visa
                type:
                  type: string
                  description: Product type – `Credit`, `Debit`, `PrePaid`
                  example: Debit
                regulated:
                  type: boolean
                  description: Exempt/non-exempt from the debit card interchange fee standards
                  example: true
                currency:
                  type: string
                  description: "Corresponding issuer billing currency \n[4217 ISO 3-Digit Currency Code](https://developers.tabapay.com/reference/currency-numbers#/)"
                  example: '840'
                country:
                  type: string
                  description: "[Corresponding issuer country code \nCountry Code](https://developers.tabapay.com/reference/country-codes#/)"
                  example: '840'
            push:
              type: object
              description: Credit Transaction
              properties:
                enabled:
                  type: string
                  description: Eligible for push
                  example: true
                network:
                  type: string
                  description: Payment network
                  example: Visa
                type:
                  type: string
                  description: Product type – `Credit`, `Debit`, `PrePaid`
                  example: Debit
                regulated:
                  type: boolean
                  description: Exempt/non-exempt from the debit card interchange fee standards
                  example: true
                currency:
                  type: string
                  description: "Corresponding issuer billing currency \n[ISO 4217 Currency Number](https://developers.tabapay.com/reference/currency-numbers#/)"
                  example: '840'
                country:
                  type: string
                  description: "Corresponding issuer country code \n[Country Code](https://developers.tabapay.com/reference/country-codes#/)"
                  pattern: ^[0-9]{3}$
                availability:
                  type: string
                  description: "Estimated Funds Availability:\n- `Immediate` => Funds are usually available in 30 minutes \n- `Next Business Day` => Funds are available Next Business day.\n- `Few Business Days` => Funds are available within a few business days."
                  example: Immediate
        AU:
          type: object
          description: Real Time Account Updater (RTAU) Results. Returns only if query string `AU` is present.
          properties:
            reasonCode:
              type: string
              description: "Always present when `AU` is requested. For more info on values, refer to [Account Updater Codes](/reference/account-updater).\n\n  - `U`: Unsupported card brand (not Visa/MasterCard). No lookup performed; original card unchanged; no card object. \n\n **Visa Values**: \n - `A`: Account number updated \n - `E`: Expiration date updated\n - `C`: Closed account advice\n - `Q`: Contact cardholder advice \n - `O`: Cardholder opted-out \n - `V`: Validation, account number and expiration date unchanged \n - `P`: Participating BIN, no match \n - `N`: Non-participating BIN \n - `101`: Non-numeric account number \n - `103`: Invalid expiry \n - `104`: Merchant not registered \n - `122`: Sub-merchant not registered \n\n **Mastercard Values:** \n - `UPDATE`: Account number updated \n - `EXPIRY`: Expiration date updated \n - `CONTAC`: Account Closed \n - `UNKNWN`: Account not found \n - `VALID`: Valid, details unchanged"
            card:
              type: object
              description: Present whenever at least one card field (below) is produced. Omitted if there is nothing to return (e.g., unsupported brand, or no change and no in-the-clear permission).
              properties:
                accountNumber:
                  type: string
                  description: "Contains the effective (updated, or original if unchanged) full card number in the clear. \n Only when the client has the Receiving Card in the Clear permission."
                  example: '4111111111111111'
                expirationDate:
                  type: string
                  description: "Effective expiration date (updated, or original if unchanged).\n\n Only when the client has the Receiving Card in the Clear permission."
                  example: '202612'
                token:
                  type: string
                  description: "RSA-encrypted, `80`: prefixed token of the effective card payload. \n\n Only when the client does not have the in-the-clear permission and the request supplied a raw card number (not an account-based query)."
                newBIN:
                  type: string
                  description: "First 6 digits (BIN) of the new card. \n\n Only when the client does not have the in-the-clear permission and the card number changed."
                  example: '400000'
                newLast4:
                  type: string
                  description: "Last 4 digits of the new card. \n\n Only when the client does not have the in-the-clear permission and the card number changed."
                  example: '0000'
                newExpirationDate:
                  type: string
                  description: "The new expiration date.\n\n Only when the client does not have the in-the-clear permission and the expiration date changed."
                  example: '202707'
        AVS:
          type: object
          description: <<glossary:AVS>> Results. Returns only if query string `AVS` is present.
          properties:
            avsID:
              type: string
              description: <<glossary:AVS>> Transaction Identifier
              example: D1Xdr2dGHjGnJ0b07vcXEB
            networkRC:
              type: string
              description: '[Network Response Code](https://developers.tabapay.com/reference/iso-network-codes#/)'
              example: '85'
            networkID:
              type: string
              description: NetworkID
              example: '422330486047511'
            authorizeID:
              type: string
              description: ID
            resultText:
              type: string
              description: <<glossary:AVS>> Result Text. ***Optional***
              example: NOT DECLINED
            codeAVS:
              type: string
              description: '[<<glossary:AVS>> Response Code](https://developers.tabapay.com/reference/avs-response-codes#/)'
              example: Y
            codeSecurityCode:
              type: string
              description: '[Security Code Response Code](https://developers.tabapay.com/reference/cvv2-response-codes#/)'
              example: M
            par:
              type: string
              description: '[Payment Account Reference](https://developers.tabapay.com/docs/payment-account-reference-par#/)'
              example: V0010013022073812195104908149
            codeMAC:
              type: string
              description: "[Merchant Advice Code](https://developers.tabapay.com/docs/merchant-advice-code-mac#/). Expected Values:\n  - 01: New account information available\n  - 02: Cannot approve at this time, try again later\n  - 03: Do not try again\n  - 04: Token requirements not fulfilled for this token type\n  - 05: Negotiated value not approved\n  - 21: Payment Cancellation (MasterCard use only)\n  - 22: Merchant does not qualify for product code\n  - 24: Retry after 1 hour (Mastercard use only)\n  - 25: Retry after 24 hours (Mastercard use only)\n  - 26: Retry after 2 days (Mastercard use only)\n  - 27: Retry after 4 days (Mastercard use only)\n  - 28: Retry after 6 days (Mastercard use only)\n  - 29: Retry after 8 days (Mastercard use only)\n  - 30: Retry after 10 days (Mastercard use only)\n  - 40: Consumer non-reloadable prepaid card\n  - 41: Consumer single-use virtual card number"
            EC:
              $ref: '#/components/schemas/EC'
            ANI:
              type: object
              description: '[<<glossary:ANI>> Results](https://developers.tabapay.com/reference/ani-response-codes). Present only if query string `ANI` is present.'
              properties:
                codeMatch:
                  type: string
                  description: "Whether the <<glossary:ANI>> match was performed. \n- `M` Match was performed.\n- `N` Match was ***not*** performed.\n- `U` ANI is not supported."
                  example: M
                codeFullName:
                  type: string
                  description: 'Name match result for the full name (first + middle + last)


                    - `M` Match.

                    - `P` Partial Match.

                    - `N` No Match.'
                  example: M
                codeFirstName:
                  type: string
                  description: 'First name match result

                    - `M` Match.

                    - `P` Partial Match.

                    - `N` No Match.'
                  example: M
                codeMiddleName:
                  type: string
                  description: 'Middle name match result

                    - `M` Match.

                    - `P` Partial Match.

                    - `N` No Match.'
                  example: M
                codeLastName:
                  type: string
                  description: 'Last name match result

                    - `M` Match.

                    - `P` Partial Match.

                    - `N` No Match.'
                  example: M
        fees:
          type: object
          description: Fees Check. Present only if query string `Fees` is present.
          properties:
            pull:
              type: object
              description: Debit Transaction
              properties:
                interchange:
                  type: string
                  description: Interchange Fees
                network:
                  type: string
                  description: Network Fees
                tabapay:
                  type: string
                  description: TabaPay Fees
            push:
              type: object
              description: Credit Transaction
              properties:
                interchange:
                  type: string
                  description: Interchange Fees
                network:
                  type: string
                  description: Network Fees
                tabapay:
                  type: string
                  description: TabaPay Fees
        limits:
          type: object
          description: Card and user limits on the account.
          properties:
            card:
              type: string
              description: Card limit details for push and pull
              properties:
                push:
                  type: string
                  description: Push limits on the card account
                  properties:
                    1Day:
                      type: string
                      description: Daily push limits on the card account
                    3Day:
                      type: string
                      description: 3 day push limits on the card account
                    7Day:
                      type: string
                      description: 7 day push limits on the card account
                    30Day:
                      type: string
                      description: 30 push limits on the card account
                pull:
                  type: string
                  description: Pull limits on the card account
                  properties:
                    1Day:
                      type: string
                      description: Daily pull limits on the card account
                    3Day:
                      type: string
                      description: 3 day pull limits on the card account
                    7Day:
                      type: string
                      description: 7 day pull limits on the card account
                    30Day:
                      type: string
                      description: 30 day pull limits on the card account
            user:
              type: string
              description: User limit details for push and pull
              properties:
                push:
                  type: string
                  description: Push limits on the user's account
                  properties:
                    1Day:
                      type: string
                      description: Daily push limits on the user's account
                    3Day:
                      type: string
                      description: 3 day push limits on the user's account
                    7Day:
                      type: string
                      description: 7 day push limits on the user's account
                    30Day:
                      type: string
                      description: 30 push limits on the user's account
                pull:
                  type: string
                  description: Pull limits on the user's account
                  properties:
                    1Day:
                      type: string
                      description: Daily pull limits on the user's account
                    3Day:
                      type: string
                      description: 3 day pull limits on the user's account
                    7Day:
                      type: string
                      description: 7 day pull limits on the user's account
                    30Day:
                      type: string
                      description: 30 day pull limits on the user's account
        RTM:
          type: string
          description: '(Coming Soon)


            Real-Time Monitoring (RTM) & Blocking details on the card'
          properties:
            status:
              type: string
              description: Current RTM status on the card account
            transactDate:
              type: string
              description: Last transacted to trigger an RTM rule
        subClientID:
          type: string
          description: Unique subClientID of the merchant or subClient
    networkLimits:
      type: object
      description: 'List of Network Limits.

        Network is listed only if if different from above limits'
      properties:
        network:
          type: string
          description: Network Name
        transaction:
          type: string
          description: Network Transaction Limit
        daily:
          type: string
          description: '*Approximate* Network Daily Limit'
    clientRetrieveResponse:
      type: object
      properties:
        SC:
          $ref: '#/components/schemas/SC'
        EC:
          $ref: '#/components/schemas/EC'
        label:
          type: string
          example: ClientLabel
          description: 'The Client Label is the human readable identifier used to identify you versus using your ClientID. It may be used:

            - in part of the file name for various [Reports]](/docs/reporting) TabaPay generates for you, and

            - in part of the URL for access to the Client WebSite.'
        networks:
          type: object
          description: List of Available Networks
          properties:
            pull:
              type: array
              description: 'For Pull Transactions


                Array can be empty or is a List of [Network Names](https://developers.tabapay.com/reference/networks#/).'
              items:
                type: string
            push:
              type: array
              description: 'For Push Transactions


                Array can be empty or is a List of [Network Names](https://developers.tabapay.com/reference/networks#/).'
              items:
                type: string
        limits:
          type: object
          description: ''
          properties:
            currency:
              type: string
              description: '[ISO 4217 Currency Number](https://developers.tabapay.com/reference/currency-numbers#/)'
              example: '840'
            pull:
              type: object
              description: ''
              properties:
                transaction:
                  type: string
                  example: '0.25'
                  description: Pull Transaction [Limit](/docs/adjusting-limits)
                daily:
                  type: string
                  example: '1.00'
                  description: '*Approximate* Pull Daily [Limit](/docs/adjusting-limits)'
                networks:
                  type: array
                  items:
                    $ref: '#/components/schemas/networkLimits'
                  description: 'List of Network Limits


                    Network is listed only if different from above Pull Limits'
            push:
              type: object
              description: ''
              properties:
                transaction:
                  type: string
                  example: '0.25'
                  description: Push Transaction [Limit](/docs/adjusting-limits)
                daily:
                  type: string
                  example: '1.00'
                  description: '*Approximate* Push Daily [Limit](/docs/adjusting-limits)'
                networks:
                  type: array
                  items:
                    $ref: '#/components/schemas/networkLimits'
                  description: 'List of Network Limits


                    Network is listed only if different from above Push Limits'
    clientNotFound:
      type: object
      properties:
        SC:
          $ref: '#/components/schemas/SC'
        EC:
          $ref: '#/components/schemas/EC'
        EM:
          $ref: '#/components/schemas/EM'
    clientLocked:
      type: object
      properties:
        SC:
          $ref: '#/components/schemas/SC'
        EC:
          $ref: '#/components/schemas/EC'
        EM:
          $ref: '#/components/schemas/EM'
    createLedgerResponse:
      type: object
      properties:
        SC:
          $ref: '#/components/schemas/SC'
        EC:
          $ref: '#/components/schemas/EC'
        EM:
          $ref: '#/components/schemas/EM'
        ledgerID:
          $ref: '#/components/schemas/tpLedgerID'
    ledgerCreate:
      type: object
      required:
      - referenceID
      - userID
      - bank
      - type
      - currency
      properties:
        referenceID:
          $ref: '#/components/schemas/tpReferenceID'
        userID:
          $ref: '#/components/schemas/tpUserID'
        bank:
          type: string
          description: Ledger backing bank identifier
        type:
          type: string
          enum:
          - BalanceHolding
          - Passthrough
        currency:
          $ref: '#/components/schemas/tpISO4217Numeric'
    tpReferenceID:
      type: string
      description: Client-defined reference identifier
      minLength: 1
      maxLength: 15
      pattern: ^[A-Za-z0-9._-]+$
    tpUserID:
      type: string
      description: TabaPay user identifier
      pattern: ^[A-Za-z0-9]{22}$
    tpLedgerID:
      type: string
      description: TabaPay ledger identifier
      pattern: ^[A-Za-z0-9]{22}$
    tpISO4217Numeric:
      type: string
      description: ISO-4217 numeric currency code
      pattern: ^[0-9]{3}$
      example: '840'
    subclientCreate:
      type: object
      required:
      - name
      - tin
      - type
      - email
      - address
      - phone
      - mcc
      properties:
        name:
          type: string
          description: Company Name
          pattern: ^[ a-zA-Z0-9_-]$
        tin:
          type: string
          description: '[Taxpayer Identification Number](https://en.wikipedia.org/wiki/Taxpayer_Identification_Number) (EIN or SSN) needs to be 9 digits exactly.'
        type:
          type: string
          description: 'Company Type:

            - `LLC`

            - `LLP`

            - `C-Corp`

            - `S-Corp`

            - `SoleProprietor`

            - `Nonprofit`

            - `Charitable`

            - `Other`'
        url:
          type: string
          description: Company URL
        email:
          $ref: '#/components/schemas/email'
        address:
          $ref: '#/components/schemas/address'
        phone:
          $ref: '#/components/schemas/phone'
        mcc:
          type: string
          pattern: ^[0-9]{4}$
          description: Merchant Category Code
        mvv:
          type: string
          pattern: ^[0-9]{6}$
          description: Visa Merchant Verification Code - requires Visa registration
        maid:
          type: string
          pattern: ^[0-9]{6}$
          description: MasterCard Identification - requires MasterCard registration
        settlement:
          type: object
          required:
          - purchase
          - disbursement
          - fee
          - exception
          description: Settlement Accounts
          properties:
            purchase:
              type: object
              description: Purchase
              required:
              - routingNumber
              - accountNumber
              properties:
                routingNumber:
                  $ref: '#/components/schemas/routingNumber'
                accountNumber:
                  type: string
                  pattern: ^[0-9]{4,17}$
                  description: Account Number
            disbursement:
              type: object
              description: Disbursement
              required:
              - routingNumber
              - accountNumber
              properties:
                routingNumber:
                  $ref: '#/components/schemas/routingNumber'
                accountNumber:
                  type: string
                  pattern: ^[0-9]{4,17}$
                  description: Account Number
            fee:
              type: object
              description: Fee
              required:
              - routingNumber
              - accountNumber
              properties:
                routingNumber:
                  $ref: '#/components/schemas/routingNumber'
                accountNumber:
                  type: string
                  pattern: ^[0-9]{4,17}$
                  description: Account Number
            exception:
              type: object
              description: Exception
              required:
              - routingNumber
              - accountNumber
              properties:
                routingNumber:
                  $ref: '#/components/schemas/routingNumber'
                accountNumber:
                  type: string
                  pattern: ^[0-9]{4,17}$
                  description: Account Number
            serviceType:
              type: string
              description: "Indicate the payment rail that TabaPay will utilize with the client/sub-client. \nOptions are: \n\n - N - Next-Day <<glossary:ACH>> (Default) \n - S - Same-Day <<glossary:ACH>> \n - R - <<glossary:RTP>>"
        fees:
          $ref: '#/components/schemas/fees'
        reserveAccount:
          $ref: '#/components/schemas/reserveAccount'
        businessOwners:
          $ref: '#/components/schemas/businessOwners'
    address:
      type: object
      description: Address
      required:
      - line1
      - city
      - state
      - zipcode
      properties:
        line1:
          $ref: '#/components/schemas/line1'
        line2:
          $ref: '#/components/schemas/line2'
        city:
          $ref: '#/components/schemas/city'
        state:
          $ref: '#/components/schemas/state'
        zipcode:
          $ref: '#/components/schemas/zipcode'
        country:
          $ref: '#/components/schemas/country'
    cardTypeFee:
      type: object
      description: Card Type Fee
      properties:
        intlCreditFixed:
          type: string
          description: Fixed fee for successful international credit card transactions
          pattern: ^[0-9]*.?[0-9]{0,4}$
        intlCreditVariable:
          type: string
          description: Variable fee for successful international credit card transactions ( % )
          pattern: ^[0-9]*.?[0-9]{0,4}$
        intlDebitFixed:
          type: string
          description: Fixed fee for successful international debit card transactions
          pattern: ^[0-9]*.?[0-9]{0,4}$
        intlDebitVariable:
          type: string
          description: Variable fee for successful international debit card transactions ( % )
          pattern: ^[0-9]*.?[0-9]{0,4}$
        creditSurchargeFixed:
          type: string
          description: Fixed fee for credit card surcharges
          pattern: ^[0-9]*.?[0-9]{0,4}$
        creditSurchargeVariable:
          type: string
          description: Variable fee for credit card surcharges (%)
          pattern: ^[0-9]*.?[0-9]{0,4}$
        amexFixed:
          type: string
          description: Fixed fee for successful American Express transactions
          pattern: ^[0-9]*.?[0-9]{0,4}$
        amexVariable:
          type: string
          description: Variable fee for successful American Express transactions ( % )
          pattern: ^[0-9]*.?[0-9]{0,4}$
    email:
      type: string
      pattern: ^[A-Za-z._-]+@(?:[A-Za-z_-]+.?)*.[A-Za-z]+$
      description: Valid Email Address
    createSubClientResponse:
      type: object
      properties:
        SC:
          type: string
          description: HTTP Status Code
        EC:
          type: string
          description: Internal Error Code to help TabaPay trace the error.
        EM:
          type: string
          description: Short Description of Error if Error Occurred.
    fees:
      type: object
      description: 'Set fees for this subclient. For more information refer to: [Fees for Sub-Clients during Boarding](https://developers.tabapay.com/docs/fees-for-sub-clients-during-boarding)'
      required:
      - type
      properties:
        type:
          type: string
          description: 'Type of fee - Merchant Discount Rate or Interchange Plus Plus. Values must be one of the following: MDR or IPP.'
          pattern: ^[MDR]{3}|[IPP]{3}$
          example: MDR
        monthlyMinimumProcessingFee:
          type: string
          description: Merchant minimum fee if total processing fee is below the contract stated min
          pattern: ^[0-9]*.?[0-9]{0,4}$
        authorizationFee:
          type: string
          description: Authorization (no funds movement) fee; Charged on failed purchases as well.
          pattern: ^[0-9]*.?[0-9]{0,4}$
        AVSFee:
          type: string
          description: Address Verification Fee
          pattern: ^[0-9]*.?[0-9]{0,4}$
        deleteFee:
          type: string
          description: Fee charged with every successful Delete API request
          pattern: ^[0-9]*.?[0-9]{0,4}$
        MIDFee:
          type: string
          description: Fixed fee for MID being active
          pattern: ^[0-9]*.?[0-9]{0,4}$
        purchaseFeeFixed:
          type: string
          description: Fixed fee for successful purchases
          pattern: ^[0-9]*.?[0-9]{0,4}$
        purchaseFeeVariable:
          type: string
          description: Variable fee for successful purchases ( % ) So 5% will be 0.0500
          pattern: ^[0-9]*.?[0-9]{0,4}$
        purchaseFeeCap:
          type: string
          description: Cap on Purchase fee. Applies to successful purchases.
          pattern: ^[0-9]*.?[0-9]{0,4}$
        disbursementFeeFixed:
          type: string
          description: Fixed fee for successful disbursements
          pattern: ^[0-9]*.?[0-9]{0,4}$
        monthlySubClientFee:
          type: string
          description: Fixed sub-client fee per month
          pattern: ^[0-9]*.?[0-9]{0,4}$
        chargebackFee:
          type: string
          description: Fee charged on every chargeback
          pattern: ^[0-9]*.?[0-9]{0,4}$
        retrievalFee:
          type: string
          description: Fee charged on every successful Retrieve Account
          pattern: ^[0-9]*.?[0-9]{0,4}$
        batchFee:
          type: string
          description: Fee charged for batches that are run
          pattern: ^[0-9]*.?[0-9]{0,4}$
        ACHNextDayCreditFee:
          type: string
          description: Fixed fee charged on every ACH Next Day Credit transaction
          pattern: ^[0-9]*.?[0-9]{0,4}$
        ACHNextDayDebitFee:
          type: string
          description: Fixed fee charged on every ACH Next Day Debit transaction
          pattern: ^[0-9]*.?[0-9]{0,4}$
        ACHSameDayCreditFee:
          type: string
          description: Fixed fee charged on every ACH Same Day Credit transaction
          pattern: ^[0-9]*.?[0-9]{0,4}$
        ACHSameDayDebitFee:
          type: string
          description: Fixed fee charged on every ACH Same Day Debit transaction
          pattern: ^[0-9]*.?[0-9]{0,4}$
        ACH_NSFFee:
          type: string
          description: Fixed fee charged for every ACH NSF
          pattern: ^[0-9]*.?[0-9]{0,4}$
        ACHFraudFee:
          type: string
          description: Fixed fee charged on every ACH fraudulent transaction
          pattern: ^[0-9]*.?[0-9]{0,4}$
        ACHAdminReturnFee:
          type: string
          description: Fixed fee charged on every ACH return
          pattern: ^[0-9]*.?[0-9]{0,4}$
        RTPCreditFee:
          type: string
          description: Fixed fee charged on every <<glossary:RTP>> Credits
          pattern: ^[0-9]*.?[0-9]{0,4}$
        RTP_RFPFee:
          type: string
          description: Fixed fee charged on every <<glossary:RTP>> Request for Payment
          pattern: ^[0-9]*.?[0-9]{0,4}$
        cardTypeFee:
          $ref: '#/components/schemas/cardTypeFee'
        3DSFee:
          type: string
          description: Fixed fee for every 3DS invocation
          pattern: ^[0-9]*.?[0-9]{0,4}$
        accountUpdaterFee:
          type: string
          description: Fixed fee for each account updater request
          pattern: ^[0-9]*.?[0-9]{0,4}$
    reserveAccount:
      type: object
      description: Set reserve account for this subclient. If you add a reserve account, you will need a routing number and an account number.
      required:
      - routingNumber
      - accountNumber
      properties:
        routingNumber:
          type: string
          description: Routing number for the reserve account (9 digits). *Required if account number is present.*
          pattern: ^[0-9]{9,9}$
        accountNumber:
          type: string
          description: Account number for the reserve account (4-17 digits). *Required if routing number is present.*
          pattern: ^[0-9]{4,17}$
        calculationsCurrencyCode:
          type: string
          description: "ISO-4217 3 digit currency code (3 digits). \n [Currency Code](https://developers.tabapay.com/reference/country-codes). Default: 840 (USD)."
          pattern: ^[0-9]{3,3}$
          example: '840'
        calculationsVariable:
          type: string
          description: 'Percentage of amount to be held daily. Format: xxx.xxxx (e.g. 5% is written as 0.05). '
          pattern: ^[0-9]*.?[0-9]{0,4}$
        calculationsFixed:
          type: string
          description: "Amount after which hold on reserve is released (same format as amount). \n [Currency Amount](https://developers.tabapay.com/reference/currency-numbers)"
          pattern: ^[0-9]*.?[0-9]{0,4}$
        calculationsNoOfDays:
          type: string
          description: Number of days after which amount held is released (1-4 digits).
          pattern: ^[0-9]{1,4}$
    businessOwners:
      type: object
      description: 'Individuals that own at least 25% of the entity, or the largest owner if no one owns at least 25%.

        **Note: If you plan to add/remove/modify any owner information in the future, you will need re-submit all existing information to the update SubClient API. It is recommend that you store the owner information for this purpose.**'
      required:
      - businessOwner1
      properties:
        businessOwner1:
          $ref: '#/components/schemas/businessOwner'
        businessOwner2:
          $ref: '#/components/schemas/businessOwner'
        businessOwner3:
          $ref: '#/components/schemas/businessOwner'
        businessOwner4:
          $ref: '#/components/schemas/businessOwner'
    businessOwner:
      type: object
      description: Additional individuals that own at least 25% of the entity.
      required:
      - firstName
      - lastName
      - dateOfBirth
      properties:
        firstName:
          type: string
          description: First name
        middleName:
          type: string
          description: Middle name
        lastName:
          type: string
          description: Last name
        dateOfBirth:
          type: string
          description: 'Date of birth with the format: YYYYMMDD. Owner must be at least 18 years old.'
    subclient2TransactionTypes:
      type: object
      properties:
        push:
          type: boolean
          description: Push transaction enabled
        pull:
          type: boolean
          description: Pull transaction enabled
    subclient2Identification:
      type: object
      properties:
        type:
          type: string
          enum:
          - SSN
          - GovernmentID
          - Passport
          - EIN
        country:
          $ref: '#/components/schemas/tpISO4217Numeric'
        number:
          type: string
          description: A unique ID number issued by a government or organization.
    subclient2CardTypesDirection:
      type: object
      properties:
        debit:
          type: boolean
          description: Debit card type enabled
        credit:
          type: boolean
          description: Credit card type enabled
        prepaid:
          type: boolean
          description: Prepaid card type enabled
    subclient2CardTypes:
      type: object
      properties:
        push:
          $ref: '#/components/schemas/subclient2CardTypesDirection'
        pull:
          $ref: '#/components/schemas/subclient2CardTypesDirection'
    subclient2NetworkDirection:
      type: object
      properties:
        enabled:
          type: boolean
          description: Network enabled flag
        mccOverride:
          type: string
          pattern: ^[0-9]{4}$
    subclient2NetworkConfig:
      type: object
      properties:
        push:
          $ref: '#/components/schemas/subclient2NetworkDirection'
        pull:
          $ref: '#/components/schemas/subclient2NetworkDirection'
    subclient2SettlementAccount:
      type: object
      properties:
        routingNumber:
          $ref: '#/components/schemas/routingNumber'
        accountNumber:
          type: string
          pattern: ^[0-9]{4,17}$
        ledgerID:
          $ref: '#/components/schemas/tpLedgerID'
    subclient2Settlement:
      type: object
      properties:
        purchase:
          $ref: '#/components/schemas/subclient2SettlementAccount'
        disbursement:
          $ref: '#/components/schemas/subclient2SettlementAccount'
        fee:
          $ref: '#/components/schemas/subclient2SettlementAccount'
        exception:
          $ref: '#/components/schemas/subclient2SettlementAccount'
        serviceType:
          type: string
          description: "Includes: \n - N: Next Day \n - S: Same Day \n - R: RTP "
          enum:
          - N
          - S
          - R
    subclient2Create:
      type: object
      required:
      - name
      - mcc
      properties:
        name:
          type: string
        tin:
          type: string
          pattern: ^[0-9]{9}$
          description: '[Taxpayer Identification Number](https://en.wikipedia.org/wiki/Taxpayer_Identification_Number) needs to be 9 digits exactly.'
        type:
          type: string
          enum:
          - LLC
          - LLP
          - C-Corp
          - S-Corp
          - SoleProprietor
          - Nonprofit
          - Charitable
          - NaturalPerson
          - Other
        url:
          type: string
        email:
          type: string
          format: email
          description: Valid Email Address
        address:
          $ref: '#/components/schemas/address'
        phone:
          $ref: '#/components/schemas/phone'
        mcc:
          type: string
          pattern: ^[0-9]{4}$
          description: 'Merchant Category Code (MCC): 4-digit code assigned by card networks to classify a merchant by the type of business they operate'
        mvv:
          type: string
          pattern: ^[0-9]{6}$
          description: 'Visa Merchant Verification Code (MVV): requires Visa registration'
        maid:
          type: string
          pattern: ^[0-9]{6}$
          description: 'MasterCard Identification (MAID): requires MasterCard registration'
        evv:
          type: string
          description: 'Enabler Verification Value (EVV): A 5-character alphanumeric value assigned by Visa based on the use case'
        userID:
          $ref: '#/components/schemas/tpUserID'
        iso:
          type: string
          pattern: ^[0-9]{3}$
        useCase:
          type: string
          description: "Specify the use case for the SubClient \n\n Valid options: \n\n - `PP` Person to Person AFTs \n\n - `CG` Charity Donation \n\n - `EC` ECommerce"
        transactionTypes:
          $ref: '#/components/schemas/subclient2TransactionTypes'
        identification:
          $ref: '#/components/schemas/subclient2Identification'
        cardTypes:
          $ref: '#/components/schemas/subclient2CardTypes'
        visa:
          $ref: '#/components/schemas/subclient2NetworkConfig'
        mastercard:
          $ref: '#/components/schemas/subclient2NetworkConfig'
        discover:
          $ref: '#/components/schemas/subclient2NetworkConfig'
        settlement:
          $ref: '#/components/schemas/subclient2Settlement'
        fees:
          $ref: '#/components/schemas/fees'
        reserveAccount:
          allOf:
          - $ref: '#/components/schemas/reserveAccount'
          - type: object
            properties:
              ledgerID:
                type: string
                description: TabaPay Ledger ID
        businessOwners:
          $ref: '#/components/schemas/businessOwners'
        ipAddress:
          type: string
          format: ipv4
        dbaName:
          type: string
          description: Doing Business As (DBA)
        payoutSchedule:
          type: string
    createTransactionRequest:
      type: object
      required:
      - type
      - amount
      - customer
      - callback
      properties:
        type:
          type: string
          description: Transaction Type. Currently, only `pull` is supported.
          pattern: ^pull$
        user1:
          type: string
          description: '1-15 character User1 Data.


            *Optional*'
          pattern: ^[ a-zA-Z0-9_-]{1,15}$
        user2:
          type: string
          description: '1-15 character User2 Data.


            *Optional*'
          pattern: ^[ a-zA-Z0-9_-]{1,15}$
        amount:
          $ref: '#/components/schemas/amount'
        customer:
          type: object
          required:
          - name
          description: Customer
          properties:
            name:
              type: object
              required:
              - first
              - last
              description: Name
              properties:
                first:
                  type: string
                  description: First Name
                  pattern: ^[ a-zA-Z0-9_-]+$
                last:
                  type: string
                  description: Last Name
                  pattern: ^[ a-zA-Z0-9_-]+$
            address:
              type: object
              description: Address
              required:
              - line1
              - city
              - state
              - zipcode
              - country
              properties:
                line1:
                  $ref: '#/components/schemas/line1'
                line2:
                  $ref: '#/components/schemas/line2'
                city:
                  $ref: '#/components/schemas/city'
                state:
                  $ref: '#/components/schemas/state'
                zipcode:
                  $ref: '#/components/schemas/zipcode'
                country:
                  $ref: '#/components/schemas/country'
            callback:
              type: object
              required:
              - type
              - value
              description: 'Callback, contact TabaPay.


                Optional.'
              properties:
                type:
                  type: string
                  description: Currently, `URL` is the only value supported.
                value:
                  type: string
                  description: URL String
    transactionRequestResponse:
      type: object
      properties:
        SC:
          type: integer
          description: HTTP Status Code
        EC:
          type: string
          description: 'Internal Error Code.


            Present if `SC` is `200`.'
        EM:
          type: string
          description: Short Description of Error if `EC` is not `"0"`.
        otppID:
          type: string
          description: '22-character TransactionRequestID (<<glossary:OTPP>>)


            Present if `SC` is `200`.'
        link:
          type: string
          description: 'URL


            Present if `SC` is `200`.'
    createUserResponse:
      type: object
      properties:
        SC:
          $ref: '#/components/schemas/SC'
        EC:
          $ref: '#/components/schemas/EC'
        EM:
          $ref: '#/components/schemas/EM'
        userID:
          $ref: '#/components/schemas/tpUserID'
    userCreate:
      type: object
      required:
      - referenceID
      - type
      - name
      - identification
      properties:
        referenceID:
          $ref: '#/components/schemas/tpReferenceID'
        type:
          type: string
          enum:
          - LLC
          - LLP
          - C-Corp
          - S-Corp
          - SoleProprietor
          - Nonprofit
          - Charitable
          - NaturalPerson
          - Other
        name:
          $ref: '#/components/schemas/userName'
        email:

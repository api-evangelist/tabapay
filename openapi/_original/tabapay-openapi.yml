          type: string
          description: '22-character `avsID`

            Received in the response of [QueryCard + AVS/ANI](https://developers.tabapay.com/reference/cardquery).


            *Optional*'
          pattern: ^[a-zA-Z0-9_-]+$
        purposeOfPayment:
          $ref: '#/components/schemas/purposeOfPayment'
        memo:
          $ref: '#/components/schemas/memo'
        achOptions:

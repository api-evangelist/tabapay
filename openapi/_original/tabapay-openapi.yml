openapi: 3.0.0
info:
  title: TabaPay APIs
  description: TabaPay Resource and Service Operations
  version: 1.0.0
  license:
    name: All rights reserved
servers:
- url: https://{FQDN}:{PORT}
  description: TabaPay APIs
  variables:
    FQDN:
      default: FQDN
      description: Contact [TabaPay Support](https://tabapay.zendesk.com/hc/en-us/requests/new) for the Fully Qualified Domain Name you should be using.
    PORT:
      default: PORT
      description: Ensure you have the capability to access the PORT TabaPay specifies in your credentials file.
security:
- bearerAuth: []
tags:
- name: Account
  description: This resource represents a Client's Account.
- name: Bank
  description: This resource represents a Bank.
- name: Card
  description: This resource represents a Payment Card (Debit Card, PrePaid Card, or Credit Card).
- name: Client
  description: This resource represents a Client.
- name: Ledger
  description: This resource represents a Client's Ledger.
- name: SubClient
  description: This resource represents a Client's SubClient.
- name: TransactionRequest
  description: This resource represents a TransactionRequest One-time Payment Portal (<<glossary:OTPP>>)
- name: User
  description: This resource represents a Client's User.
- name: Verification
  description: This resource represents a Client's Verification.
- name: Key
  description: This resource represents an RSA Encryption Key.
- name: OFAC
  description: This resource represents a Name on the OFAC Sanctions List.
- name: FXRate
  description: This resource represents an FX Rate.
- name: Transaction
  description: This resource represents a Client's Transaction.
paths:
  /v2/clients/{ClientID}/3ds/authenticate:
    post:
      tags:
      - 3D Secure
      summary: 3D Secure Authenticate
      description: 3D Secure Card Authentication Request.
      operationId: 3dsauthenticate
      parameters:
      - $ref: '#/components/parameters/ClientID'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/3dsauthenticate'
        required: true
      responses:
        '200':
          description: An Authenticate Response is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/3dsAuthenticateResponse'
              examples:
                Success:
                  value:
                    SC: 200
                    EC: '0'
                    actionCode: SUCCESS
                    errorNumber: '0'
                    errorDescription: Success
                    3dsVersion: 2.1.0
                    processorTransactionID: '11111111111111111111'
                    status: Y
                    ECI: '05'
                    UCAF: '1111111111111111111111111111'
                Error:
                  value:
                    SC: 200
                    EC: '0'
                    actionCode: FAILURE
                    errorNumber: '0'
                    errorDescription: Success
                    3dsVersion: 2.2.0
                    processorTransactionID: f2T1gBHnnq028ujOLlC1
                    status: N
                    ECI: '07'
                    UCAF: ''
  /v2/clients/{ClientID}/3ds/init:
    post:
      tags:
      - 3D Secure
      summary: 3D Secure Initialize
      description: "Initializes a 3D Secure Card Authentication Request. \n\nRequest to enable at [TabaPay Support](https://tabapay.zendesk.com/hc/en-us/requests/new#/) or [help@tabapay.com](mailto:help@tabapay.com)"
      operationId: 3dsinit
      parameters:
      - $ref: '#/components/parameters/ClientID'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/3dsinit'
            examples:
              3DS Init with Card Info:
                value:
                  referenceID: 1dkt062024
                  account:
                    card:
                      accountNumber: '4000000000002446'
                  order:
                    orderID: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                    currency: '840'
                    amount: '4.00'
              3DS Init with AccountID:
                value:
                  referenceID: 1dkt062024
                  account:
                    accountID: BikavmpEWcIxHodMwv5g3A
                  order:
                    orderID: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                    currency: '840'
                    amount: '4.00'
        required: true
      responses:
        '200':
          description: A JWT is Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/3dsInitResponse'
              example:
                SC: 200
                EC: '0'
                3dsID: ID_BASE64-URL-SAFE-VALUE
                jwt: JWT-BASE64-URL-SAFE-VALUE
                deviceCollectionURL: https://someplace.somewhere.com/DeviceCollect
        '207':
          description: One or more Failures occurred while processing the Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiResponseSCEC'
              example:
                SC: 207
                EC: InternalErrorCode
        '404':
          description: The AccountID does not point to a valid Account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiResponseSCECEM'
              example:
                SC: 404
                EC: InternalErrorCode
                EM: AccountID
  /v2/clients/{ClientID}/3ds/lookup:
    post:
      tags:
      - 3D Secure
      summary: 3D Secure Lookup
      description: 3D Secure Card Lookup.
      operationId: 3dslookup
      parameters:
      - $ref: '#/components/parameters/ClientID'
      - $ref: '#/components/parameters/enhancedResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/3dslookup'
        required: true
      responses:
        '200':
          description: A Lookup Response is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/3dsLookupResponse'
              examples:
                frictionless successful authentication, without enhancedResponse:
                  value:
                    SC: 200
                    EC: '0'
                    3dsVersion: 2.1.0
                    enrolled: Y
                    processorTransactionID: '11111111111111111111'
                    dsTransactionID: 11111111-2222-3333-4444-555555555555
                    status: Y
                    ECI: '05'
                    UCAF: '1111111111111111111111111111'
                  summary: Successful Authentication, No Challenge
                challenge, without enhancedResponse:
                  value:
                    SC: 200
                    EC: '0'
                    3dsVersion: 2.1.0
                    enrolled: Y
                    ECI: '07'
                    processorTransactionID: '11111111111111111111'
                    dsTransactionID: 11111111-2222-3333-4444-555555555555
                    challengeURL: https://someplace.somewhere.com/challenge
                    payload: A_LONG_PAYLOAD
                frictionless successful authentication, with enhancedResponse:
                  value:
                    SC: 200
                    EC: '0'
                    3dsVersion: 2.1.0
                    enrolled: Y
                    processorTransactionID: '11111111111111111111'
                    dsTransactionID: 11111111-2222-3333-4444-555555555555
                    status: Y
                    ECI: '05'
                    UCAF: '1111111111111111111111111111'
                    signatureVerification: Y
                  summary: No Challenge, with enhancedResponse
                challenge, with enhancedResponse:
                  value:
                    SC: 200
                    EC: '0'
                    3dsVersion: 2.1.0
                    enrolled: Y
                    processorTransactionID: '11111111111111111111'
                    dsTransactionID: 11111111-2222-3333-4444-555555555555
                    status: C
                    ECI: '07'
                    challengeURL: https://someplace.somewhere.com/challenge
                    payload: A_LONG_PAYLOAD
                    stepUpURL: '[step up URL]'
                    signatureVerification: Y
                failed, with enhancedResponse:
                  value:
                    SC: 200
                    EC: '0'
                    3dsVersion: 2.1.0
                    enrolled: Y
                    3dsRC: '0000'
                    processorTransactionID: '11111111111111111111'
                    dsTransactionID: 11111111-2222-3333-4444-555555555555
                    status: N
                    ECI: '07'
                    challengeURL: https://someplace.somewhere.com/challenge
                    payload: A_LONG_PAYLOAD
                    signatureVerification: Y
                    cardholderInfo: 'Note: Additional authentication is required by the issuing bank for this transaction, please contact Bank at 123-456-7890.'
        '207':
          description: One or more Failures occurred while processing the Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiResponseSCEC'
              example:
                SC: 207
                EC: InternalErrorCode
        '404':
          description: The AccountID does not point to a valid Account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiResponseSCECEM'
              example:
                SC: 404
                EC: InternalErrorCode
                EM: Account
  /v1/clients/{ClientID}/accounts:
    post:
      tags:
      - Account
      summary: Create Account
      description: 'Creates an Account.


        In circumstances where you fail to receive an `accountID` from us, you can do a [retrieve via referenceID](https://developers.tabapay.com/reference/retrieve-via-referenceid). *(Allowed only up to 24 hours after original request)*'
      operationId: accountCreate
      parameters:
      - name: ClientID
        in: path
        description: '22-character <<glossary:ClientID>>. <br> Note: <<glossary:SubClientID>> will create accountIDs at the same Client level. This is not recommended if you cannot share SubClient and Client accountIDs at the same level.'
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - $ref: '#/components/parameters/RejectDuplicateCard'
      - $ref: '#/components/parameters/OKToAddDuplicateCard'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/createAccount'
            examples:
              Create Bank Account Request:
                value:
                  bank:
                    routingNumber: '021000021'
                    accountNumber: '123456789'
                    accountType: C
                  owner:
                    name:
                      first: Owner
                      middle: Test
                      last: Name
                    address:
                      line1: 123 Street
                      city: San Francisco
                      state: CA
                      zipcode: '94103'
                      country: '840'
                  referenceID: uniqueid123
              Create Card Account Request:
                value:
                  referenceID: Unique_refID123
                  card:
                    accountNumber: '4111111111111111'
                    expirationDate: '202708'
                  owner:
                    name:
                      company: High Value Company
                      first: Test
                      middle: D
                      last: Name
                    address:
                      line1: 123 Street
                      city: San Francisco
                      state: CA
                      zipcode: '94103'
                      country: '840'
        required: true
      responses:
        '200':
          description: An Account is Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/accountCreateResponse'
              example:
                SC: 200
                EC: '0'
                accountID: TabaPay_AccountID_22ch
                card:
                  last4: '1234'
                  expirationDate: '202502'
        '207':
          description: Account created, but Duplicate Card Check Failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiResponseSCEC'
              example:
                SC: 207
                EC: InternalErrorCode
        '409':
          description: Duplicate Card Check Matched.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/accountCreateResponseDuplicateCard'
              example:
                SC: 409
                EC: 3C463000
                EM: Duplicate
                duplicateAccountIDs:
                - ih0V8HSE2S6gAUqCkG29uw
  /{Version}/clients/{ClientID}/accounts/{AccountID}:
    delete:
      tags:
      - Account
      summary: Delete Account
      description: The Account is marked for Deletion.
      operationId: accountDelete
      parameters:
      - name: Version
        in: path
        required: true
        schema:
          type: string
          pattern: ^v1$
          example: v1
        description: '`v1` is the only accepted value.'
      - $ref: '#/components/parameters/ClientID'
      - $ref: '#/components/parameters/AccountID'
      - $ref: '#/components/parameters/DeleteDuplicateCard'
      responses:
        '200':
          description: Account is marked for deletion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiResponseSCEC'
              example:
                SC: 200
                EC: '0'
        '207':
          description: Account marked for deletion, but Delete Duplicate Card Check Failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiResponseSCEC'
              example:
                SC: 207
                EC: InternalErrorCode
    get:
      tags:
      - Account
      summary: Retrieve Account
      description: 'Retrieves the Account.


        In circumstances where you fail to receive an `accountID` from us, you can do a [retrieve via referenceID](https://developers.tabapay.com/reference/retrieve-via-referenceid). *(Allowed only up to 24 hours after original request)*'
      operationId: accountRetrieve
      parameters:
      - name: Version
        in: path
        required: true
        schema:
          type: string
          pattern: ^v1$
          example: v1
        description: '`v1` is the only accepted value.'
      - $ref: '#/components/parameters/ClientID'
      - $ref: '#/components/parameters/AccountID'
      responses:
        '200':
          description: Account retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/retrieveAccountResponse'
              example:
                SC: 200
                EC: '0'
                referenceID: '1'
                card:
                  last4: '9990'
                  expirationDate: '202012'
                owner:
                  name:
                    first: John
                    last: Customer
                  address:
                    line1: 465 Fairchild Drive
                    line2: 'Suite #222'
                    city: Mountain View
                    state: CA
                    zipcode: '94043'
                  phone:
                    number: '4159808222'
        '421':
          description: Too late to retrieve account by referenceId. Use accountId.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiResponseSCECEM'
              example:
                SC: 421
                EC: InternalErrorCode
                EM: ReferenceID
    put:
      tags:
      - Account
      summary: Update Account
      description: Updates the Account. Use `v1` to replace all fields.
      operationId: updateAccount
      parameters:
      - name: Version
        in: path
        required: true
        schema:
          type: string
          pattern: ^v{1,2}$
          example: v1
        description: '`v1` and `v2` are the only accepted values. Use `v1` to replace all fields, and `v2` replace any one or more fields, excluding excluding card account numbers.'
      - $ref: '#/components/parameters/ClientID'
      - $ref: '#/components/parameters/AccountID'
      - $ref: '#/components/parameters/RejectDuplicateCard'
      - $ref: '#/components/parameters/OKToAddDuplicateCard'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/updateAccount'
        required: true
      responses:
        '200':
          description: Account is updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiResponseSCECEM'
              example:
                SC: 200
                EC: '0'
        '207':
          description: Account updated, but update duplicate card check failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiResponseSCEC'
              example:
                SC: 207
                EC: InternalErrorCode
        '409':
          description: Duplicate card check matched.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/accountCreateResponseDuplicateCard'
              example:
                SC: 409
                EC: 3C463000
                EM: Duplicate
                duplicateAccountIDs:
                - ih0V8HSE2S6gAUqCkG29uw
  /v1/clients/{ClientID}/banks:
    post:
      tags:
      - Bank
      summary: Query Bank
      description: Returns the attributes for the requested Bank.
      operationId: bankQuery
      parameters:
      - $ref: '#/components/parameters/ClientID'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/queryBank'
            examples:
              Query Bank Real-Time Payments:
                value:
                  routingNumber: '011001234'
        required: true
      responses:
        '200':
          description: The Bank's Attributes are returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/queryBankResponse'
              examples:
                Routing Number Enabled:
                  value:
                    SC: 200
                    EC: '0'
                    RTP: true
                    RTPAttributes:
                      TCH: true
                      TCHRequestForPayment: false
                      FED: true
                      FEDRequestForPayment: false
                Routing Number Not Enabled:
                  value:
                    SC: 200
                    EC: '0'
                    RTP: false
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/queryBankResponse'
              examples:
                Invalid Routing Number:
                  value:
                    SC: 400
                    EC: InternalErrorCode
                    EM: accounts.destinationAccount.bank.routingNumber
  /v1/clients/{ClientID}/cards:
    post:
      tags:
      - Card
      summary: Query Card
      description: 'Returns the attributes for the requested Payment Card.


        Request to enable <Glossary>ANI</Glossary> or <Glossary>AVS</Glossary> at [TabaPay Support](https://tabapay.zendesk.com/hc/en-us/requests/new#/) or [help@tabapay.com](mailto:help@tabapay.com)'

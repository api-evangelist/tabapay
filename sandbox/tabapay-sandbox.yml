modes:
- name: sandbox
  notes: Client-specific FQDN + bearer credentials issued by TabaPay; config changes land Mondays (requests due
    Friday).
- name: uat
  notes: User-acceptance environment; like sandbox, not PCI compliant — test cards only.
- name: production
  notes: Separate FQDN + credentials and separate allowlisted IPs; sandbox certification required before go-live.

description: TabaPay's Sandbox is a client-provisioned test environment (request access via help@tabapay.com); credentials
  include a client-specific FQDN and bearer token. Not PCI compliant — only published test cards may be used. Sandbox
  and Production IPs must differ; sandbox is rate limited and performance tests are forbidden (IPs get blocked).
  Errors are simulated by magic amounts, AVS/ANI trigger values, and RTP account numbers rather than test-mode key
  prefixes.
